<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trello Board - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <h1>Trello Board</h1>
      <p id="form-subtitle">Sign in to your account</p>
      
      <form id="auth-form">
        <div class="form-group mt-24">
          <label for="username">Username</label>
          <input type="text" class="input" id="username" placeholder="Enter username" required>
        </div>
        
        <div class="form-group mt-16">
          <label for="password">Password</label>
          <input type="password" class="input" id="password" placeholder="Enter password" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block mt-24" id="submit-btn">Sign In</button>
      </form>
      
      <p class="auth-toggle" id="toggle-text">
        Don't have an account? <a href="#" id="toggle-link">Sign up</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    let isSignUp = false;

    const form = document.getElementById('auth-form');
    const subtitle = document.getElementById('form-subtitle');
    const submitBtn = document.getElementById('submit-btn');
    const toggleText = document.getElementById('toggle-text');

    const toggleMode = () => {
      isSignUp = !isSignUp;
      subtitle.textContent = isSignUp ? 'Create a new account' : 'Sign in to your account';
      submitBtn.textContent = isSignUp ? 'Sign Up' : 'Sign In';
      toggleText.innerHTML = isSignUp 
        ? 'Already have an account? <a href="#" id="toggle-link">Sign in</a>'
        : 'Don\'t have an account? <a href="#" id="toggle-link">Sign up</a>';
      document.getElementById('toggle-link').addEventListener('click', (e) => {
        e.preventDefault();
        toggleMode();
      });
    };

    document.getElementById('toggle-link').addEventListener('click', (e) => {
      e.preventDefault();
      toggleMode();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showToast('Please fill in all fields');
        return;
      }

      try {
        if (isSignUp) {
          await api.signup(username, password);
          showToast('Account created! Please sign in.');
          toggleMode();
        } else {
          const data = await api.signin(username, password);
          setToken(data.token);
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        showToast(err.message);
      }
    });
  </script>
</body>
</html>
