<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trello Board - Organization</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <span class="logo">Trello Board</span>
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="page-content">
    <div class="container">
      <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
      
      <div class="flex-between mb-24">
        <div>
          <h1 id="org-title" style="font-size: 24px; margin-bottom: 4px;">Loading...</h1>
          <p id="org-desc" class="text-secondary">Loading...</p>
        </div>
        <button class="btn btn-primary" onclick="showAddMemberModal()">+ Add Member</button>
      </div>

      <section class="mb-24">
        <h2 class="section-title">Boards</h2>
        <div id="boards-container" class="boards-scroll mt-16">
        </div>
      </section>

      <section>
        <h2 class="section-title">Members</h2>
        <div id="members-container" class="members-list mt-16">
        </div>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/organization.js"></script>
</body>
</html>
